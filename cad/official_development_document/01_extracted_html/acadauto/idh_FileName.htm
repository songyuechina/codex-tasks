<p CLASS="TitleSpacing">
<P CLASS="1-liner">Specifies the file name of an entry in the File Dependency List.</P>

<P CLASS="h1-access"><A HREF="FileName_see_also.htm">See Also</A> | <A HREF="ex_FileName.htm">Example</A></P>
<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.FileName
<P class="element">object</p><p class=element-desc><A HREF='idh_FileDependency.htm'>FileDependency</A> <BR>
The object this property applies to.
<P class="element">FileName</p><p class=element-desc>String; read-only<BR>
Saved base file name without the path.</P>
