<p CLASS="TitleSpacing">
<P CLASS="1-liner">Sets the block scale value for the specified row and column. </P>

<P CLASS="h1-access"><A HREF="tableobject_see_also.htm">See Also</A> | <A HREF="ex_none.htm">Example</A></P>
<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.SetBlockScale(row, col, blkScale)
<P class="element">Object</p><p class=element-desc><A HREF='idh_Table_Object.htm'>Table</A> <BR>
The object this method applies to.
<P class="element">row</p><p class=element-desc>Long; the row
<P class="element">col</p><p class=element-desc>Long; the column
<P class="element">blkScale</p><p class=element-desc>Double; the block scale
