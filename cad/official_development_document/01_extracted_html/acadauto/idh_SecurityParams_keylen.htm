<p CLASS="TitleSpacing">
<P CLASS="1-liner">Specifies the length of the encryption key.</P>

<P CLASS="h1-access"><A HREF="keylen_see_also.htm">See Also</A> | <A HREF="ex_keylen.htm">Example</A></P>
<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.KeyLength
<P class="element">object</p><p class=element-desc><A HREF='idh_securityparams.htm'>SecurityParams</A> <BR>
The object this property applies to.
<P class="element">KeyLength</p><p class=element-desc>Long; read-write<BR>
The length of the encryption key, which is based on the value of <A HREF='idh_SecurityParams_provname.htm'>ProviderName</A>.</P>
