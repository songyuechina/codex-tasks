<p CLASS="TitleSpacing">
<P CLASS="1-liner">Determines whether the given spline is planar.</P>

<P CLASS="h1-access"><A HREF="isplanar_see_also.htm">See Also</A> | <A HREF="ex_isplanar.htm">Example</A></P>
<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.IsPlanar
<P class="element">object</p><p class=element-desc><A HREF='idh_spline_object.htm'>Spline</A><BR>
The object this property applies to.
<P class="element">IsPlanar</p><p class=element-desc>Boolean; read-only
<P CLASS="Constant">TRUE<SPAN CLASS="BodyText">: The spline is planar.</SPAN>
<P CLASS="Constant">FALSE<SPAN CLASS="BodyText">: The spline is not planar.</SPAN>
