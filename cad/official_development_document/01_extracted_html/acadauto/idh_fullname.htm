<p CLASS="TitleSpacing">
<P CLASS="1-liner">Gets the name of the application or document, including the path.</P>

<P CLASS="h1-access"><A HREF="fullname_see_also.htm">See Also</A> | <A HREF="ex_fullname.htm">Example</A></P>
<P CLASS="Heading-2">Signature

<P class="element">object</p><p class=element-desc><A HREF='idh_application_object.htm'>Application</A>, <A HREF='idh_document_object.htm'>Document</A><BR>
The objects this property applies to.
<P class="element">FullName</p><p class=element-desc>String; read-only<BR>
