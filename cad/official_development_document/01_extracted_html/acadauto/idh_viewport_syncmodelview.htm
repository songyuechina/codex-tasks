<p CLASS="TitleSpacing">
<P CLASS="1-liner">Updates the viewport parameters with the parameters in the associated model view.</P>

<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.SyncModelView
<P class="element">object</p><p class=element-desc><A HREF='idh_pviewport_object.htm'>PViewport</A><BR>

<P CLASS="Heading-2">Remarks
<P CLASS="body"><b>Note</b> To access this property, use the IAcadPViewport interface.
