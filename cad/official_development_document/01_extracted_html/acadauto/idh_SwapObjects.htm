<p CLASS="TitleSpacing">
<P CLASS="1-liner">Swaps the draw order positions of two objects.</P>

<P CLASS="h1-access"><A HREF="SwapObjects_see_also.htm">See Also</A> | <A HREF="ex_SortentsTable.htm">Example</A></P>
<P CLASS="Heading-2">Signature
<P CLASS="syntax">object.SwapOrder (Object1, Object2)
<P class="element">object</p><p class=element-desc><A HREF='idh_SortentsTable_Object.htm'>SortentsTable</A> <BR>
The object this method applies to.
<P class="element">Object1</p><p class=element-desc><A HREF='idh_iacadentity_interface.htm'>AcadEntity</A>; the first object.</P>
<P class="element">Object2</p><p class=element-desc><A HREF='idh_iacadentity_interface.htm'>AcadEntity</A>; the second object.</P>
